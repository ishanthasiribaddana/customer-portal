# lending.temcobank.com - Lending System (SSO)
server {
    listen 80;
    server_name lending.temcobank.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lending.temcobank.com;

    ssl_certificate /etc/letsencrypt/live/lending.temcobank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lending.temcobank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8085/temco-admin/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /temco-bank-system-project/ {
        rewrite ^/temco-bank-system-project/(.*)$ /temco_loan_system-1.8.1/$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host lending.temcobank.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 302 /temco-bank-system-project/;
    }
}

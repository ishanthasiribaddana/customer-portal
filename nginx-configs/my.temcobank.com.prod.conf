# =============================================================================
# my.temcobank.com - TEMCO Customer Portal
# =============================================================================
# Frontend: Docker container my-frontend (port 8092)
# Auth API: SSO via temco-api.war in finance-api container (port 8087)
# Student API: FinanceApp Node.js API (port 8086) — NOT YET ON PROD
# SSL: Cloudflare Origin Certificate (*.temcobank.com, valid until 2041)
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name my.temcobank.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name my.temcobank.com;

    ssl_certificate /etc/ssl/cloudflare/temcobank.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/temcobank.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Auth APIs → SSO (temco-api.war on finance-api container, port 8087) ──
    location /api/v1/customer/auth/ {
        proxy_pass http://127.0.0.1:8087/temco-api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── Frontend → Docker container (port 8092) ──
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

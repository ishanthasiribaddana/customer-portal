# my.temcobank.com - Customer Portal (SSO)
server {
    listen 80;
    server_name my.temcobank.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my.temcobank.com;

    ssl_certificate /etc/letsencrypt/live/my.temcobank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.temcobank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8087/temco-api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

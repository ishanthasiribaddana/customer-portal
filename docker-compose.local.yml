# =============================================================================
# CUSTOMER PORTAL - Local Development Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.local.yml up -d
#
# Auth:   SSOService on port 8085 (independent auth provider)
# APIs:   FinanceApp on port 8086 (student lookup)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Frontend - Development mode with hot reload
  # ---------------------------------------------------------------------------
  frontend:
    image: node:18-alpine
    container_name: customer-portal-dev
    working_dir: /app
    environment:
      - VITE_API_URL=/api
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3003"

volumes:
  frontend_node_modules:

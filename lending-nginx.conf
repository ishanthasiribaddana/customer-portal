# lending.temcobank.com - Legacy Loan System (GlassFish)
server {
    listen 80;
    server_name lending.temcobank.com legacy.temcobank.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lending.temcobank.com legacy.temcobank.com;

    ssl_certificate /etc/letsencrypt/live/lending.temcobank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lending.temcobank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect root to login
    location = / {
        return 302 /temco-bank-system-project/user/login.xhtml;
    }

    # Rewrite temco-bank-system-project to temco_loan_system-1.8.1 and proxy to GlassFish
    location /temco-bank-system-project/ {
        rewrite ^/temco-bank-system-project/(.*)$ /temco_loan_system-1.8.1/$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host lending.temcobank.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fallback for other requests
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host lending.temcobank.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

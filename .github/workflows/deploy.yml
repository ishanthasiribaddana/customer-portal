name: Deploy Customer Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "mkdir -p /tmp/my-frontend-deploy"
          scp -r frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/my-frontend-deploy/
          scp nginx.conf ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/my-frontend-nginx.conf

      - name: Update container and reload
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "\
            docker cp /tmp/my-frontend-deploy/. my-frontend:/usr/share/nginx/html/ && \
            docker cp /tmp/my-frontend-nginx.conf my-frontend:/etc/nginx/conf.d/default.conf && \
            docker exec my-frontend nginx -t && \
            docker exec my-frontend nginx -s reload && \
            rm -rf /tmp/my-frontend-deploy /tmp/my-frontend-nginx.conf"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8092/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed: HTTP $STATUS"

      - name: Deployment complete
        run: echo "✅ Deployed to https://my.temcobank.com"

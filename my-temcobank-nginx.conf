# my.temcobank.com - Customer Portal
server {
    listen 80;
    server_name my.temcobank.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name my.temcobank.com;

    ssl_certificate /etc/letsencrypt/live/my.temcobank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.temcobank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Auth APIs → SSOService (port 8085)
    location /api/v1/customer/auth/ {
        proxy_pass http://127.0.0.1:8085/temco-api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Student APIs → FinanceApp Node.js API (port 8086)
    location /api/students {
        proxy_pass http://127.0.0.1:8086/api/students;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/student-lookup {
        proxy_pass http://127.0.0.1:8086/api/student-lookup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend proxy to Docker container
    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
